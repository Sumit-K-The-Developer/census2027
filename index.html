<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Census 2027 Enumerator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#16325c">
<style>
:root{--b:#16325c;--b2:#2f5fa8;--s:#e8821e;--bg:#f3f5f8;--l:#d5dbe6;--m:#667085;--ok:#13795b;--r:#b42318;--t:#18202e}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 "Segoe UI","Nirmala UI",system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--b);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--s)}
header h1{font-size:19px;margin:0;flex:1;cursor:pointer;line-height:1.25}
header h1 small{display:block;font-size:13px;font-weight:400;opacity:.9}
.hb{background:#ffffff22;color:#fff;border:1px solid #fff7;border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer;font:inherit}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px;margin-bottom:14px}
button,select,input,textarea{font:inherit}
.btn{min-height:48px;padding:0 20px;border-radius:8px;border:1.5px solid var(--b);background:#fff;color:var(--b);cursor:pointer;font-weight:600}
.btn.p{background:var(--b);color:#fff}.btn.d{border-color:var(--r);color:var(--r)}.btn:disabled{opacity:.35}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:48px;padding:8px 12px;border:1.5px solid #b4bdd0;border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #f6b26b;outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 18px;border-radius:24px;border:1.5px solid #b4bdd0;background:#fff;cursor:pointer}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.q{padding:14px 0;border-bottom:1px solid var(--l)}.q:last-child{border:0}
.ql{font-weight:600;margin-bottom:8px}.ql i{font-style:normal;color:#fff;background:var(--b2);border-radius:6px;padding:1px 8px;margin-right:8px;font-size:15px}
.sub{font-size:14px;color:var(--m);margin:2px 0 4px}
.na{color:var(--m);background:#edf0f5;padding:12px;border-radius:8px;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{text-align:center;margin:0}.stat b{display:block;font-size:30px;color:var(--b)}
.bar{height:10px;background:var(--l);border-radius:5px;overflow:hidden}.bar div{height:100%;background:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.tab{white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--l);background:#fff;cursor:pointer}
.tab.on{background:var(--b);color:#fff;border-color:var(--b)}
table{width:100%;border-collapse:collapse}
td{padding:9px 10px;border-bottom:1px solid var(--l);vertical-align:top}
td:first-child{width:44px;color:var(--b2);font-weight:700}td:nth-child(2){width:46%}
td.a{font-weight:600}td.n{color:var(--m);font-style:italic}
details{margin-bottom:14px}summary{cursor:pointer;font-weight:700;font-size:18px;padding:12px 16px;background:#e3eaf7;border-radius:8px;min-height:48px}
.tag{background:var(--s);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px;margin-left:8px}
.hl{cursor:pointer}.hl:hover{border-color:var(--b2)}
.muted{color:var(--m)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.card>.bar{margin-top:10px}.side .bar{margin:4px 0}
.lay{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
.side{position:sticky;top:86px;max-height:calc(100vh - 100px);overflow:auto;margin:0}
.mb{display:block;width:100%;text-align:left;min-height:56px;padding:8px 12px;border:1.5px solid var(--l);border-radius:8px;background:#fff;margin-bottom:6px;cursor:pointer}
.mb.on{border-color:var(--b);background:#e3eaf7}
.mini{height:6px;background:var(--l);border-radius:3px;overflow:hidden;margin-top:5px}.mini div{height:100%;background:var(--ok)}
.sbtns{display:flex;flex-direction:column;gap:4px;margin:0 0 10px 12px}
.sbtns .tab{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;white-space:normal;text-align:left;padding:6px 12px}
.warn{color:var(--r);font-size:14px;margin-top:6px}.wn:empty{display:none}
@media(max-width:820px){.lay{grid-template-columns:1fr}.side{position:static;max-height:none}}
</style></head>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang=localStorage.getItem('lang')||'en';
const t=s=>{const p=s.split('|');return lang==='hi'?(p[1]||p[0]):p[0]};
const O=s=>s.split(',').map(x=>{const p=x.split('|');return{v:p[0],h:lang==='hi'?(p[1]||p[0]):p[0]}});
const today=new Date().toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let cfg={};try{cfg=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}cfg.ebs=cfg.ebs||[];const saveCfg=()=>localStorage.setItem('cfg',JSON.stringify(cfg));
/* ---------- storage (IndexedDB) ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('census27',1);r.onupgradeneeded=()=>r.result.createObjectStore('hh',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await dbp;return new Promise((res,rej)=>{const T=d.transaction('hh',m);const o=f(T.objectStore('hh'));T.oncomplete=()=>res(o&&o.result);T.onerror=()=>rej(T.error)})};
const all=()=>tx('readonly',s=>s.getAll()),put=h=>tx('readwrite',s=>s.put(JSON.parse(JSON.stringify(h)))),del=id=>tx('readwrite',s=>s.delete(id));
/* ---------- the 40 questions ---------- */
const YN='Yes|हाँ,No|नहीं',
GR=['Basic details (Q1–5)|मूल विवरण (प्र. 1–5)','Marriage & nationality|विवाह एवं राष्ट्रीयता','Religion, family & health|धर्म, परिवार एवं स्वास्थ्य','Education|शिक्षा','Work|कार्य एवं आर्थिक गतिविधि','Birth place & migration|जन्म स्थान एवं प्रवास','Children & vaccination|संतान एवं टीकाकरण','Banks & documents|बैंक एवं दस्तावेज़'],
REL='Head|मुखिया,Wife|पत्नी,Husband|पति,Son|पुत्र,Daughter|पुत्री,Father|पिता,Mother|माता,Brother|भाई,Sister|बहन,Son-in-law|दामाद,Daughter-in-law|बहू,Grandchild|पोता/पोती,Other relative|अन्य रिश्तेदार,Not related|संबंधित नहीं',

DIS='Seeing|दृष्टि,Hearing|श्रवण,Speech|वाणी,Locomotor|चलन,Intellectual|बौद्धिक,Mental illness|मानसिक रोग,Multiple|एकाधिक,Other|अन्य',
QUA='Below primary|प्राथमिक से कम,Primary|प्राथमिक,Middle|मिडिल,Secondary (10th)|हाई स्कूल,Higher secondary (12th)|इंटरमीडिएट,Diploma / ITI|डिप्लोमा / आईटीआई,Graduate|स्नातक,Post-graduate|स्नातकोत्तर,Doctorate|डॉक्टरेट,Other|अन्य',
ECO='Cultivator|कृषक,Agricultural labourer|कृषि मजदूर,Household industry worker|घरेलू उद्योग कामगार,Other worker|अन्य कामगार,Non-worker|अकामगार',

NON='Student|विद्यार्थी,Household duties|गृहकार्य,Dependent|आश्रित,Pensioner|पेंशनभोगी,Retired|सेवानिवृत्त,Other|अन्य',
SEK='Seeking work|काम की तलाश में,Available for work|काम के लिए उपलब्ध,Neither|दोनों नहीं',

MIG='Work / employment|काम / रोज़गार,Business|व्यापार,Education|शिक्षा,Marriage|विवाह,Moved with household|परिवार के साथ,Birth|जन्म,Other|अन्य',

const Q=[],q=(n,tx,g,...f)=>Q.push({n,t:tx,g,f}),PL=k=>[[k+'s','t','','State|राज्य'],[k+'d','t','','District|जिला'],[k+'v','t','','Village / Town|गाँव / शहर']],
HAS=(k,lb,mx,ty)=>[[k+'h','yn','','Available?|उपलब्ध है?'],[k,ty||'dg','',lb,k+'h',mx]];
q(1,'What is the name of the person?|व्यक्ति का नाम क्या है?',0,['q1','t']);
q(2,'What is your relationship with the head of the family?|परिवार के मुखिया से आपका क्या संबंध है?',0,['q2','s',REL]);
q(3,'What is your sex? (Male / Female / Other)|लिंग (पुरुष/महिला/अन्य) क्या है?',0,['q3','s','Male|पुरुष,Female|महिला,Other|अन्य']);
q(4,'What is your date of birth? (and current age)|जन्मतिथि क्या है? (और वर्तमान आयु कितनी है?)',0,['q4d','d','','Date of birth|जन्मतिथि'],['q4a','dg','','Age (years)|आयु (वर्ष)','',3]);
q(5,'What is your current marital status?|वर्तमान वैवाहिक स्थिति क्या है?',0,['q5','s',MAR]);

q(7,"What is the spouse's name?|पति/पत्नी का नाम क्या है?",1,['q7','dl']);
q(8,'What is your nationality?|आपकी राष्ट्रीयता क्या है?',1,['q8','s','Indian|भारतीय,Other|अन्य']);
q(9,'What is your religion?|आपका धर्म क्या है?',2,['q9','s',RLG]);

q(11,"What is the father's name and related details?|पिता का नाम और संबंधित विवरण क्या है?",2,['q11','dl']);

q(14,'What is your mother tongue? Which other languages do you know?|आपकी मातृभाषा कौन-सी है? आपको अन्य कौन-सी भाषाएँ आती हैं?',2,['q14a','t','','Mother tongue|मातृभाषा'],['q14b','t','','Other languages known|अन्य भाषाएँ']);
