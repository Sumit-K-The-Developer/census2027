<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Census 2027 Enumerator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#16325c">
<style>
:root{--b:#16325c;--b2:#2f5fa8;--s:#e8821e;--bg:#f3f5f8;--l:#d5dbe6;--m:#667085;--ok:#13795b;--r:#b42318;--t:#18202e}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 "Segoe UI","Nirmala UI",system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--b);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--s)}
header h1{font-size:19px;margin:0;flex:1;cursor:pointer;line-height:1.25}
header h1 small{display:block;font-size:13px;font-weight:400;opacity:.9}
.hb{background:#ffffff22;color:#fff;border:1px solid #fff7;border-radius:8px;min-height:38px;padding:0 12px;cursor:pointer;font:inherit;font-size:15px}
.hb.p{background:#fff;color:var(--b);border-color:#fff;font-weight:600}.hb.d{border-color:#ffb4a8;color:#ffd9d3}.hb:disabled{opacity:.4}
.hx{display:flex;gap:6px;flex-wrap:wrap}header{flex-wrap:wrap}header h1{min-width:170px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px;margin-bottom:14px}
button,select,input,textarea{font:inherit}
.btn{min-height:48px;padding:0 20px;border-radius:8px;border:1.5px solid var(--b);background:#fff;color:var(--b);cursor:pointer;font-weight:600}
.btn.p{background:var(--b);color:#fff}.btn.d{border-color:var(--r);color:var(--r)}.btn:disabled{opacity:.35}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:48px;padding:8px 12px;border:1.5px solid #b4bdd0;border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #f6b26b;outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 18px;border-radius:24px;border:1.5px solid #b4bdd0;background:#fff;cursor:pointer}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.q{padding:14px 0;border-bottom:1px solid var(--l)}.q:last-child{border:0}
.ql{font-weight:600;margin-bottom:8px}.ql i{font-style:normal;color:#fff;background:var(--b2);border-radius:6px;padding:1px 8px;margin-right:8px;font-size:15px}
.sub{font-size:14px;color:var(--m);margin:2px 0 4px}
.na{color:var(--m);background:#edf0f5;padding:12px;border-radius:8px;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{text-align:center;margin:0}.stat b{display:block;font-size:30px;color:var(--b)}
.bar{height:10px;background:var(--l);border-radius:5px;overflow:hidden}.bar div{height:100%;background:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.tab{white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--l);background:#fff;cursor:pointer}
.tab.on{background:var(--b);color:#fff;border-color:var(--b)}
table{width:100%;border-collapse:collapse}
td{padding:9px 10px;border-bottom:1px solid var(--l);vertical-align:top}
td:first-child{width:44px;color:var(--b2);font-weight:700}td:nth-child(2){width:46%}
td.a{font-weight:600}td.n{color:var(--m);font-style:italic}
details{margin-bottom:14px}summary{display:block;list-style:none;cursor:pointer;font-weight:700;font-size:18px;padding:12px 16px;background:#e3eaf7;border-radius:8px;min-height:48px}
.tag{background:var(--s);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px;margin-left:8px}
.hl{cursor:pointer}.hl:hover{border-color:var(--b2)}
.muted{color:var(--m)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.card>.bar{margin-top:10px}.side .bar{margin:4px 0}
.lay{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
.side{position:sticky;top:86px;max-height:calc(100vh - 100px);overflow:auto;margin:0}
.mb{display:block;width:100%;text-align:left;min-height:56px;padding:8px 12px;border:1.5px solid var(--l);border-radius:8px;background:#fff;margin-bottom:6px;cursor:pointer}
.mb.on{border-color:var(--b);background:#e3eaf7}
.mini{height:6px;background:var(--l);border-radius:3px;overflow:hidden;margin-top:5px}.mini div{height:100%;background:var(--ok)}
.sbtns{display:flex;flex-direction:column;gap:4px;margin:0 0 10px 12px}
.sbtns .tab{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;white-space:normal;text-align:left;padding:6px 12px}
.warn{color:var(--r);font-size:14px;margin-top:6px}.wn:empty{display:none}
@media(max-width:820px){.lay{grid-template-columns:1fr}.side{position:static;max-height:none}}
.q.em input[type=text],.q.em input[type=date],.q.em select,.q.em .chip{border-color:#e6aaa5}
.rt th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--l);color:var(--m);font-weight:600}.rt td:nth-child(2){width:auto}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px;cursor:pointer}.chk input{width:24px;height:24px;flex:none}
.tab b.ok{color:var(--ok)}.tab.on b.ok{color:#a5f0cf}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-weight:400;font-size:15px}
.pill{background:#fff;border:1px solid var(--l);border-radius:14px;padding:2px 10px;color:var(--t)}
summary::-webkit-details-marker{display:none}summary::before{content:'▸ ';color:var(--b2)}details[open]>summary::before{content:'▾ '}
.q{position:relative}.q.key .ql{padding-right:22px}.kd{position:absolute;top:14px;right:6px;width:10px;height:10px;border-radius:50%;background:#1fa463}
</style></head>
<body>
<header><h1 id="ti" onclick="A.home()"></h1><div class="hx" id="hx"></div><button class="hb" id="ins" hidden></button><button class="hb" id="st" onclick="A.cfg()"></button><button class="hb" id="lg"></button></header>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang=localStorage.getItem('lang')||'en';
const t=s=>{const p=s.split('|');return lang==='hi'?(p[1]||p[0]):p[0]};
const O=s=>s.split(',').map(x=>{const p=x.split('|');return{v:p[0],h:lang==='hi'?(p[1]||p[0]):p[0]}});
const today=new Date().toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let cfg={};try{cfg=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}cfg.ebs=cfg.ebs||[];const saveCfg=()=>localStorage.setItem('cfg',JSON.stringify(cfg));
/* ---------- storage (IndexedDB) ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('census27',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('hh'))db.createObjectStore('hh',{keyPath:'id'});if(!db.objectStoreNames.contains('trash'))db.createObjectStore('trash',{keyPath:'tid'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f,st)=>{st=st||'hh';const d=await dbp;return new Promise((res,rej)=>{const T=d.transaction(st,m);const o=f(T.objectStore(st));T.oncomplete=()=>res(o&&o.result);T.onerror=()=>rej(T.error)})};
const all=()=>tx('readonly',s=>s.getAll()),put=h=>tx('readwrite',s=>s.put(JSON.parse(JSON.stringify(h)))),del=id=>tx('readwrite',s=>s.delete(id)),
tall=()=>tx('readonly',s=>s.getAll(),'trash'),tput=o=>tx('readwrite',s=>s.put(JSON.parse(JSON.stringify(o))),'trash'),tdel=id=>tx('readwrite',s=>s.delete(id),'trash');
/* ---------- the 40 questions ---------- */
const YN='Yes|हाँ,No|नहीं',
GR=['Basic details (Q1–5)|मूल विवरण (प्र. 1–5)','Marriage & nationality|विवाह एवं राष्ट्रीयता','Religion, family & health|धर्म, परिवार एवं स्वास्थ्य','Literacy & education|साक्षरता एवं शिक्षा','Work|कार्य एवं आर्थिक गतिविधि','Birth place & migration|जन्म स्थान एवं प्रवास','Children & vaccination|संतान एवं टीकाकरण','Banks & documents|बैंक एवं दस्तावेज़'],
REL='Head|मुखिया,Wife|पत्नी,Husband|पति,Son|पुत्र,Daughter|पुत्री,Father|पिता,Mother|माता,Brother|भाई,Sister|बहन,Son-in-law|दामाद,Daughter-in-law|बहू,Grandchild|पोता/पोती,Other relative|अन्य रिश्तेदार,Not related|संबंधित नहीं',
MAR='Unmarried|अविवाहित,Married|विवाहित,Widow|विधवा,Widower|विधुर,Other|अन्य',
RLG='Hindu|हिंदू,Muslim|मुस्लिम,Christian|ईसाई,Sikh|सिख,Buddhist|बौद्ध,Jain|जैन,Other religion|अन्य धर्म,No religion|कोई धर्म नहीं',
DIS='Seeing|दृष्टि,Hearing|श्रवण,Speech|वाणी,Locomotor|चलन,Intellectual|बौद्धिक,Mental illness|मानसिक रोग,Multiple|एकाधिक,Other|अन्य',
QUA='Below primary|प्राथमिक से कम,Primary|प्राथमिक,Middle|मिडिल,Secondary (10th)|हाई स्कूल,Higher secondary (12th)|इंटरमीडिएट,Diploma / ITI|डिप्लोमा / आईटीआई,Graduate|स्नातक,Post-graduate|स्नातकोत्तर,Doctorate|डॉक्टरेट,Other|अन्य',
ECO='Cultivator|कृषक,Agricultural labourer|कृषि मजदूर,Household industry worker|घरेलू उद्योग कामगार,Other worker|अन्य कामगार,Non-worker|अकामगार',
CLS='Self-employed|स्वरोजगार,Regular salaried|नियमित,Contract|संविदा,Casual labour|दैनिक मजदूर,Employer|नियोक्ता,Unpaid family worker|अवैतनिक पारिवारिक कामगार',
NON='Student|विद्यार्थी,Household duties|गृहकार्य,Dependent|आश्रित,Pensioner|पेंशनभोगी,Retired|सेवानिवृत्त,Other|अन्य',
SEK='Seeking work|काम की तलाश में,Available for work|काम के लिए उपलब्ध,Neither|दोनों नहीं',
TRV='Walk|पैदल,Bicycle|साइकिल,Two-wheeler|दोपहिया,Car / jeep|कार / जीप,Bus|बस,Train / metro|ट्रेन / मेट्रो,Other|अन्य,Works from home|घर से कार्य',
MIG='Work / employment|काम / रोज़गार,Business|व्यापार,Education|शिक्षा,Marriage|विवाह,Moved with household|परिवार के साथ,Birth|जन्म,Other|अन्य',
VAC='Government facility|सरकारी केंद्र,Private facility|निजी केंद्र,Not vaccinated|टीका नहीं लगा,Other|अन्य';
const Q=[],q=(n,tx,g,...f)=>Q.push({n,t:tx,g,f}),PL=k=>[[k+'s','t','','State|राज्य'],[k+'d','t','','District|जिला'],[k+'v','t','','Village / Town|गाँव / शहर']],
HAS=(k,lb,mx,ty)=>[[k+'h','yn','','Available?|उपलब्ध है?'],[k,ty||'dg','',lb,k+'h',mx]];
q(1,'What is the name of the person?|व्यक्ति का नाम क्या है?',0,['q1','t']);
q(2,'What is your relationship with the head of the family?|परिवार के मुखिया से आपका क्या संबंध है?',0,['q2','s',REL]);
q(3,'What is your sex? (Male / Female / Other)|लिंग (पुरुष/महिला/अन्य) क्या है?',0,['q3','s','Male|पुरुष,Female|महिला,Other|अन्य']);
q(4,'What is your date of birth? (and current age)|जन्मतिथि क्या है? (और वर्तमान आयु कितनी है?)',0,['q4d','d','','Date of birth|जन्मतिथि'],['q4a','dg','','Age (years)|आयु (वर्ष)','',3]);
q(5,'What is your current marital status?|वर्तमान वैवाहिक स्थिति क्या है?',0,['q5','s',MAR]);
q(6,'What was your age at the time of marriage?|विवाह के समय आपकी आयु कितनी थी?',1,['q6','dg','','','',3]);
q(7,"What is the spouse's name?|पति/पत्नी का नाम क्या है?",1,['q7','dl']);
q(8,'What is your nationality?|आपकी राष्ट्रीयता क्या है?',1,['q8','s','Indian|भारतीय,Other|अन्य']);
q(9,'What is your religion?|आपका धर्म क्या है?',2,['q9','s',RLG]);
q(10,'Do you belong to a Scheduled Caste (SC), Scheduled Tribe (ST) or other caste?|क्या आप अनुसूचित जाति (SC), अनुसूचित जनजाति (ST) या अन्य जाति से संबंधित हैं?',2,['q10','s','SC|अनुसूचित जाति (SC),ST|अनुसूचित जनजाति (ST),Other caste|अन्य जाति']);
q(11,"What is the father's name and related details?|पिता का नाम और संबंधित विवरण क्या है?",2,['q11','dl']);
q(12,"What is the mother's name and related details?|माता का नाम और संबंधित विवरण क्या है?",2,['q12','dl']);
q(13,'Do you have any disability? (If yes, type)|क्या आपको कोई दिव्यांगता (विकलांगता) है? (यदि हाँ, तो प्रकार)',2,['q13h','yn'],['q13t','s',DIS,'Type|प्रकार','q13h']);
q(14,'What is your mother tongue? Which other languages do you know?|आपकी मातृभाषा कौन-सी है? आपको अन्य कौन-सी भाषाएँ आती हैं?',2,['q14a','t','','Mother tongue|मातृभाषा'],['q14b','t','','Other languages known|अन्य भाषाएँ']);
q(15,'Can you read and write? Are you digitally literate?|क्या आप पढ़-लिख सकते हैं? क्या आप डिजिटल रूप से साक्षर हैं?',3,['q15a','yn','','Can read & write|पढ़-लिख सकते हैं?'],['q15b','yn','','Digitally literate|डिजिटल साक्षर?']);
q(16,'Are you currently studying in any educational institution?|क्या आप वर्तमान में किसी शैक्षणिक संस्थान में पढ़ रहे हैं?',3,['q16','yn']);
q(17,'What is your highest educational qualification and subject / stream?|आपकी प्राप्त उच्चतम शैक्षणिक योग्यता क्या हैं और विषय/शाखा क्या है?',3,['q17a','s',QUA,'Highest qualification|उच्चतम योग्यता'],['q17b','t','','Subject / stream|विषय / शाखा']);
q(18,'Did you do any work in the last one year?|क्या आपने पिछले एक वर्ष में कोई काम किया हैं?',4,['q18','yn']);
q(19,'What is your category of economic activity?|आपकी आर्थिक गतिविधि की श्रेणी क्या है?',4,['q19','s',ECO]);
q(20,'What is your occupation / profession?|आपका व्यवसाय/पेशा क्या है?',4,['q20','t']);
q(21,'What is the type of your industry, trade or service?|आपका उद्योग, व्यापार या सेवा का प्रकार क्या है?',4,['q21','t']);
q(22,'What type of worker are you? (self-employed, regular, contract etc.)|आप किस प्रकार के कामगार हैं? (स्वरोजगार, नियमित, संविदा आदि)',4,['q22','s',CLS]);
q(23,'If not working, what is your main non-economic activity?|यदि आप कार्यरत नहीं हैं, तो आपकी मुख्य गैर-आर्थिक गतिविधि क्या है?',4,['q23','s',NON]);
q(24,'Are you seeking work or available for work?|क्या आप काम की तलाश में हैं या काम करने के लिए उपलब्ध हैं?',4,['q24','s',SEK]);
q(25,'How do you travel to your place of work?|आप अपने कार्यस्थल तक आने-जाने की व्यवस्था कैसे करते हैं?',4,['q25','s',TRV,'Mode of travel|यात्रा का साधन'],['q25d','dc','','Distance to workplace (km)|कार्यस्थल तक दूरी (कि.मी.)','',5],['q25t','dg','','Time of travel, one way (minutes)|यात्रा का समय, एक तरफ़ (मिनट)','',4]);
q(26,'Where were you born? (State, District, Village/Town)|आपका जन्म कहाँ हुआ था? (राज्य, जिला, गाँव/शहर)',5,...PL('q26'));
q(27,'Where did you live before this?|इससे पहले आप कहाँ रहते थे?',5,...PL('q27'));
q(28,'What was the main reason for coming to the present place?|वर्तमान स्थान पर आने का मुख्य कारण क्या था?',5,['q28','s',MIG]);
q(29,'Since how long have you been living in the present village/town after your last migration?|आप वर्तमान गाँव/शहर में पिछले प्रवास के बाद से कितने समय से रह रहे हैं?',5,['q29','dg','','Years|वर्ष','',3]);
q(30,'What is your permanent residential address? (State, District, Village/Town)|आपका स्थायी आवासीय पता क्या है? (राज्य, जिला, गाँव/शहर)',5,...PL('q30'));
q(31,'How many children are currently alive? (Only for women of the specified marital category)|वर्तमान में जीवित बच्चों की संख्या कितनी है? (यह प्रश्न केवल निर्धारित वैवाहिक श्रेणी की महिलाओं के लिए)',6,['q31m','dg','','Sons|पुत्र','',2],['q31f','dg','','Daughters|पुत्रियाँ','',2]);
q(32,'Total number of children born alive? (Only for women of the specified marital category)|जीवित जन्मे बच्चों की कुल संख्या कितनी है? (यह प्रश्न केवल निर्धारित वैवाहिक श्रेणी की महिलाओं के लिए)',6,['q32m','dg','','Sons|पुत्र','',2],['q32f','dg','','Daughters|पुत्रियाँ','',2]);
q(33,'Number of children born alive in the last one year? (Only for women of the specified marital category)|पिछले एक वर्ष में जीवित जन्मे बच्चों की संख्या कितनी है? (यह प्रश्न केवल निर्धारित वैवाहिक श्रेणी की महिलाओं के लिए)',6,['q33m','dg','','Sons|पुत्र','',2],['q33f','dg','','Daughters|पुत्रियाँ','',2]);
q(34,'Where did you get the COVID-19 vaccination?|आपने कोविड-19 का टीकाकरण कहाँ करवाया था?',6,['q34','s',VAC,'Type of centre|केंद्र का प्रकार'],...PL('q34'));
